name: ci
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      # GitHub's default for `run` is `bash -e`, which hides a failing producer behind a
      # succeeding consumer: `pytest | tee log` would report green on a red suite.
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { python-version: "3.12" }
      - run: uv sync --frozen --extra dev
      # `tools` is the third root: build-step code that produces a committed artefact
      # (data/massive_provenance.json). An unpoliced root is this repository's known blind
      # spot, and tests/test_toolchain.py runs THIS line, so one edit covers CI and local.
      - run: uv run --frozen ruff check src tests tools --select=E9,F63,F7,F82,F401,F811 --line-length=120 | tee /tmp/ruff.log
      - run: uv run --frozen python -m compileall -q src tests tools | tee /tmp/compileall.log
      - run: uv run --frozen pytest -q | tee /tmp/pytest.log
      - run: uv run --frozen autorate verify | tee /tmp/verify.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: /tmp/*.log
          if-no-files-found: ignore
