[project]
name = "autorate"
version = "0.1.0"
description = "Certified automation rates for decision models: confidence is not permission."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autorate = "autorate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The build-step tools live outside the `src` package, so a test that imports one needs the
# repo root on sys.path; pytest alone puts `tests/` there, not `.`.
pythonpath = ["."]
